

image:
  name: gcr.io/kaniko-project/executor:debug
  entrypoint: [""]

stages:
  - test
  - build
  - deploy
  

fast-api-tests:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'
  image: python:3.11
  before_script:
    - cd ml/api
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install -r requirements-dev.txt
  script:
    - python -m py_compile main.py
    - pytest
    - flake8 .


sw-backend-test:
  stage: test
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'
  image: node:20
  before_script:
    - cd sw
    - npm ci
  script:
    - npm run lint


ml-build-and-push-docker-image:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "devv"'
  script:
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf '%s' "gitlab-ci-token:${CI_JOB_TOKEN}" | base64)\"}}}" > /kaniko/.docker/config.json

    - IMAGE_TAG="instance-${CI_COMMIT_TAG-$CI_COMMIT_SHA}-ml-api"
    - IMAGE="${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"

    - /kaniko/executor --context "${CI_PROJECT_DIR}/ml/api" --dockerfile Dockerfile --destination "${IMAGE}" --destination "${CI_REGISTRY_IMAGE}:latest-ml-api"  --snapshotMode=redo --reproducible

sw-build-and-push-docker-image:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "devv"'
  script:
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf '%s' "gitlab-ci-token:${CI_JOB_TOKEN}" | base64)\"}}}" > /kaniko/.docker/config.json

    - IMAGE_TAG="instance-${CI_COMMIT_TAG:-$CI_COMMIT_SHA}-sw-backend"
    - IMAGE="${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"

    - /kaniko/executor --context "${CI_PROJECT_DIR}/sw" --dockerfile Dockerfile --destination "${IMAGE}" --destination "${CI_REGISTRY_IMAGE}:latest-sw-backend"  --snapshotMode=redo --reproducible

deploy_model:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  image: python:3.11
  before_script:
    - cd ml/models
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python -m src.main --config_file pipeline_config/deploy.yaml

deploy_app:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh

    - mkdir -p ~/.ssh
    - cp "$SSH_PRIVATE_KEY_VM" ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa

    - ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts || true

  script:
    - echo "Deploying application..."
    - ssh -i ~/.ssh/id_rsa "ubuntu@$VM_IP" "cd ml_web_app && ./redeploy.sh"
    - echo "Finished."

